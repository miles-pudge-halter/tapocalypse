name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste secrets or private app code. For security problems use a private security advisory instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. bun start
        2. Start a run with brief "..."
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bun run doctor`
      description: Run it in the Tapocalypse checkout and paste everything it prints.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (unsupported)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and CPU architecture
      placeholder: macOS 15.4, arm64
    validations:
      required: true
  - type: input
    id: omp-version
    attributes:
      label: omp version
      description: Output of `omp --version`.
    validations:
      required: true
  - type: input
    id: tapocalypse-version
    attributes:
      label: Tapocalypse version or commit
      placeholder: 0.1.0 / abc1234
  - type: dropdown
    id: platform
    attributes:
      label: Platform under test
      multiple: true
      options:
        - Android emulator
        - Android physical device
        - iOS simulator
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The run's `stderr.log` (in the data directory under `runs/<run-id>/`) and any server output.
      render: text
