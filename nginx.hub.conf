# Path split for the team hub (see compose.hub.yml and docs/hub.md). Upload routes go straight to the hub, which checks the
# upload token itself; every other path goes through oauth2-proxy, which logs the viewer in.

server {
  listen 80;
  server_name _;
  server_tokens off;

  client_max_body_size 32m;     # the hub accepts bodies up to 32 MB
  # The hub has no idle timeout of its own (live updates are server-sent events): bound slow clients here.
  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  keepalive_timeout 30s;

  # Machines: no login. The hub validates the upload token (Authorization is passed through unchanged).
  # Quote the expression: nginx reads an unquoted "{" as the start of a block. Keep it anchored and narrow: never widen
  # it to /api/hub/v1/.*, that would let anonymous callers read GET /api/hub/v1/machines (it names uploaders).
  location ~ "^/api/hub/v1/(info|blobs/check|blobs/[0-9a-f]{64}|runs/[A-Za-z0-9-]+(/state|/live)?)$" {
    proxy_pass http://hub:4310;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # An empty value drops the header: a machine cannot claim to be a person.
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Auth-Request-Email "";
  }

  # Viewers: everything else needs the login. Live updates (the app-wide feed and each run page's stream) are server-sent
  # events, so do not buffer them: a buffered stream never delivers the first frame and the run page stays on its skeleton.
  location ~ "^/api/(events|runs/[^/]+/events)$" {
    proxy_pass http://oauth2-proxy:4180;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Uri $request_uri;       # never the client's value
    proxy_set_header X-Forwarded-Email "";               # oauth2-proxy sets the signed-in viewer itself
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://oauth2-proxy:4180;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Uri $request_uri;       # never the client's value
    proxy_set_header X-Forwarded-Email "";               # oauth2-proxy sets the signed-in viewer itself
  }
}
